name: Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Atualizar changelog no README.md
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar lista de commits
        run: |
          git log \
            --invert-grep --grep='docs: update changelog' \
            --pretty=format:'- %ad — %s (%h)' \
            --date=short > /tmp/changelog.txt

          echo "===== CHANGELOG ====="
          cat /tmp/changelog.txt

      - name: Escrever o changelog no README.md
        run: |
          python3 - <<'EOF'
          import re

          start = "<!-- CHANGELOG:START -->"
          end = "<!-- CHANGELOG:END -->"

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()
          with open("/tmp/changelog.txt", encoding="utf-8") as f:
              changelog = f.read().strip()

          block = start + "\n" + changelog + "\n" + end
          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.DOTALL)

          if not pattern.search(readme):
              raise SystemExit("Marcadores do changelog não encontrados no README.md")

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(pattern.sub(lambda m: block, readme))
          EOF

      - name: Commitar o README.md atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nada mudou no README, sem commit."
          else
            git commit -m "docs: update changelog [skip ci]"
            git push
          fi
